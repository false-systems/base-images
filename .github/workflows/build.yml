name: Build

# Builds the shared builder images natively on GitHub-hosted runners (free:
# this repository is public), one job per image group and architecture, then
# merges each image's two architectures into one tagged multi-arch index.
#
#   build    bake --load -> ci/smoke.sh -> ci/scan.sh (Trivy gate) -> push by
#            digest with SBOM + max provenance. Nothing is pushed unless the
#            smoke test and the scan pass.
#   publish  ci/publish.sh, one job per group: checks the merged index with
#            imagetools create --dry-run, then tags <tag> + <tag>-YYYYMMDD.
#
# Pull requests (Dependabot's included) run build without pushing.
#
# SAFETY: every job runs on a GitHub-hosted runner. Never add a self-hosted
# label here. This repository is public, and a pull request runs its own copy
# of this file. The org-level guard is the runner group setting: the Default
# group (the only one) has "Allow public repositories" off since 2026-09-27,
# so a self-hosted label here would only queue forever. Keep it that way; see
# README.md, "Safety". The logs are public too, so no step may print or use a
# secret beyond the GITHUB_TOKEN login below.

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "rust-ebpf/**"
      - "elixir/**"
      - "docker-bake.hcl"
      - "ci/**"
      - ".github/workflows/build.yml"
  # Every pull request, with no path filter, so the four build checks always
  # report and can be required by branch protection on main.
  pull_request:
  # Monday 04:00 UTC: after Dependabot's Monday run, clear of kured's Sunday
  # window. A rebuild from the same pinned bases still takes the week's Debian
  # security fixes (`apt-get upgrade` in each Dockerfile) and moves the tags.
  # GitHub disables this schedule after 60 days without repository activity;
  # ci/staleness.sh, run from outside, notices (README.md, "Keeping the weekly
  # rebuild alive").
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Push and tag only from main, never from a pull request or a manual run on
  # another branch.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.group }} (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # packages: write is for the main-only push steps below. A pull request
    # from a fork, and every Dependabot pull request, gets a read-only
    # GITHUB_TOKEN whatever this says.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        group: [rust, elixir]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GROUP: ${{ matrix.group }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No layer cache on purpose: every build starts from the pinned bases,
      # so it always carries the current Debian packages, and a stale cached
      # `apt-get upgrade` layer can never be what Trivy passes.
      - name: Build and load
        run: |
          docker buildx bake "$GROUP" --progress=plain \
            --set "*.platform=linux/${ARCH}" \
            --provenance=false --sbom=false \
            --load

      - name: Smoke test
        run: ci/smoke.sh "$GROUP"

      # Trivy runs from its digest-pinned image (ci/scan.sh), the same one a
      # local run uses.
      - name: Scan (report HIGH/CRITICAL, fail on fixable CRITICAL)
        run: ci/scan.sh "$GROUP"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same builder, same inputs: every layer comes from the build above, so
      # what is pushed is what was smoke-tested and scanned. A separate, short
      # invocation also keeps the registry session fresh (moby/buildkit#6422).
      # PUSH_BY_DIGEST: untagged push to each image's repository (see
      # docker-bake.hcl); the publish job tags the merged index.
      - name: Push by digest
        if: env.PUBLISH == 'true'
        env:
          PUSH_BY_DIGEST: "true"
        run: |
          meta="${RUNNER_TEMP}/bake-meta.json"
          docker buildx bake "$GROUP" --progress=plain \
            --set "*.platform=linux/${ARCH}" \
            --provenance=mode=max --sbom=true \
            --metadata-file "$meta"
          mkdir -p "${RUNNER_TEMP}/digests"
          jq -r 'to_entries[]
                 | select((.value | type) == "object" and (.value | has("containerimage.digest")))
                 | "\(.key) \(.value["containerimage.digest"])"' "$meta" |
            while read -r target digest; do
              echo "${target} linux/${ARCH} ${digest}"
              echo "$digest" > "${RUNNER_TEMP}/digests/${target}-${ARCH}"
            done

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.group }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  # One job per group, so a failure in one group (a new fixable CRITICAL, a
  # hexpm outage) does not hold back the other group's weekly rebuild. A group
  # publishes only if both of its architectures uploaded digests, and a build
  # job uploads only after its smoke test and scan passed; ci/publish.sh fails
  # before any tag moves when a digest is missing.
  publish:
    name: Publish ${{ matrix.group }}
    needs: build
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        group: [rust, elixir]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.group }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and tag
        env:
          PUBLISH_TARGETS: ${{ matrix.group }}
        run: ci/publish.sh "${RUNNER_TEMP}/digests"
